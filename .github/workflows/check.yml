name: Check

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax
        run: python -m py_compile $(git ls-files '*.py') && echo "ok"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="${{ github.event.repository.name }}-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          ls -l "$name.tar.gz"

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## / {p = ($2 == v); next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          body_path: notes.md
          files: "*.tar.gz"
          fail_on_unmatched_files: true
